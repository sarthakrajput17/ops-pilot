  name: Flask CI Pipeline

  on:
    push:
      branches:
        - main

  jobs:
    test:
      services:

          postgres:

            image: postgres:16

            env:
              POSTGRES_DB: devopsdb
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres

            ports:
              - 5432:5432

            options: >-
              --health-cmd="pg_isready -U postgres"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5  

      runs-on: ubuntu-latest

      env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: devopsdb
          DB_USER: postgres
          DB_PASSWORD: postgres

      steps:

          - name: Checkout Repository
            uses: actions/checkout@v4      

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: "3.12"
              cache: "pip"
              cache-dependency-path: app/requirements.txt  

          - name: Install Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y postgresql-client

              python -m pip install --upgrade pip
              pip install -r app/requirements.txt    

          - name: Wait for PostgreSQL
            run: |
              until pg_isready -h localhost -p 5432 -U postgres
              do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

          - name: Initialize Database
            run: |
              PGPASSWORD=postgres psql \
                -h localhost \
                -U postgres \
                -d devopsdb \
                -f database/init.sql

          - name: Run Tests
            run: |
              cd app
              pytest    

    docker-build:
      needs: test
      runs-on: ubuntu-latest

      steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and Push Docker Image
          uses: docker/build-push-action@v6
          with:
            context: ./app
            file: app/Dockerfile
            push: true
            platforms: linux/amd64,linux/arm64
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/ops-pilot:latest
              ${{ secrets.DOCKER_USERNAME }}/ops-pilot:${{ github.sha }}

    deploy-k8s:
      needs: docker-build
      runs-on: self-hosted

      steps:
        - name: Deploy to Kubernetes
          run: |
            echo "Kubernetes context:"
            kubectl config current-context

            echo "Updating Ops-Pilot deployment..."
            kubectl -n ops-pilot set image deployment/ops-pilot \
              ops-pilot=${{ secrets.DOCKER_USERNAME }}/ops-pilot:${{ github.sha }}

        - name: Wait for rollout
          run: |
            kubectl rollout status deployment/ops-pilot \
              -n ops-pilot \
              --timeout=180s

        - name: Verify deployment
          run: |
            echo "Pods:"
            kubectl get pods -n ops-pilot

            echo "Deployment:"
            kubectl get deployment ops-pilot -n ops-pilot

        - name: Health Check
          run: |
            echo "Checking application health..."

            kubectl run ops-pilot-health-check \
              -n ops-pilot \
              --restart=Never \
              --image=curlimages/curl:latest \
              -- \
              curl -f http://ops-pilot-service:5001/health

            kubectl delete pod ops-pilot-health-check \
              -n ops-pilot \
              --ignore-not-found=true