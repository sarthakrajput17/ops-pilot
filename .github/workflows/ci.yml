
name: Flask CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devopsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: devopsdb
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize Database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d devopsdb \
            -f database/init.sql

      - name: Run Tests
        run: |
          cd app
          pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ops-pilot:latest
            ${{ secrets.DOCKER_USERNAME }}/ops-pilot:${{ github.sha }}

  update-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Kubernetes Image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/ops-pilot:${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/deployment.yaml")
          text = path.read_text()

          updated, count = re.subn(
              r'^([ \t]*image:[ \t]*).+$',
              lambda match: match.group(1) + os.environ["IMAGE"],
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit("Expected exactly one image field")

          path.write_text(updated)
          PY

      - name: Create Manifest Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-ops-pilot-image
          delete-branch: true
          commit-message: "chore: update Ops-Pilot image"
          title: "chore: update Ops-Pilot Kubernetes image"
          body: |
            Automated GitOps image update.

            Updates the Kubernetes deployment to the
            image built by the successful CI workflow.